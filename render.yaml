# Render Blueprint: render.com -> New -> Blueprint -> pick this repo, and it creates
# the backend service from this file. JWT_SECRET is generated for you; you're
# asked for ALLOWED_ORIGINS in the dashboard (paste your Vercel URL once you have it).
services:
  - type: web
    name: shellhacks-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # --proxy-headers: behind Render's proxy, trust X-Forwarded-For so the rate
    # limiter sees each visitor's real IP instead of one shared proxy IP
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        value: sqlite:///./app.db
